version: "3.3"

services:
  frontend:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:3000"
    depends_on:
      - agent-system-a
    networks:
      - frontend-net
    restart: unless-stopped

  agent-system-a:
    build:
      context: .
      dockerfile: ./services/agent-system-a/Dockerfile
    container_name: agent-system-a
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCP_SERVER_URL=http://mcp-server:8002
      - AGENT_B_URL=http://agent-system-b:8001
      - MONGODB_URI=mongodb://mongodb:27017/dji_rag
      - REDIS_URL=redis://redis-cache:6379
      - BERT_MODEL_PATH=/app/models/bert_intent_classifier/model
      - RATE_LIMIT_REQUESTS=20
      - RATE_LIMIT_WINDOW=60
    depends_on:
      - mcp-server
      - agent-system-b
      - mongodb
      - redis
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped

  agent-system-b:
    build:
      context: ./services/agent-system-b
      dockerfile: Dockerfile
    container_name: agent-system-b
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AGENT_B_MODEL=${AGENT_B_MODEL}
      - SERPAPI_KEY=${SERPAPI_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL}
    networks:
      - backend-net
    restart: unless-stopped

  mcp-server:
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - QDRANT_URL=http://vector-db:6333
      - REDIS_URL=redis://redis-cache:6379
    depends_on:
      - vector-db
      - redis
    networks:
      - backend-net
    restart: unless-stopped

  vector-db:
    image: qdrant/qdrant:latest
    container_name: vector-db
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - backend-net
    restart: unless-stopped

  redis:
    image: redis/redis-stack:latest
    container_name: redis-cache
    volumes:
      - redis-storage:/data
    networks:
      - backend-net
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    volumes:
      - mongo-storage:/data/db
    networks:
      - backend-net
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  qdrant-storage:
    driver: local
  redis-storage:
    driver: local
  mongo-storage:
    driver: local
