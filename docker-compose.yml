services:
  # ─────────────────────────────────────────────────────────────────────
  # Frontend (React + Vite)
  # ─────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - agent-system-a
    networks:
      - frontend-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────
  # Agent System A (LangGraph Orchestrator)
  # ─────────────────────────────────────────────────────────────────────
  agent-system-a:
    build:
      context: .
      dockerfile: ./services/agent-system-a/Dockerfile
    container_name: agent-system-a
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCP_SERVER_URL=http://mcp-server:8002
      - AGENT_B_URL=http://agent-system-b:8001
      - MONGODB_URI=mongodb://mongodb:27017/dji_rag
      - REDIS_URL=redis://redis-cache:6379
      - BERT_MODEL_PATH=/app/models/bert_intent_classifier/model
      - RATE_LIMIT_REQUESTS=20
      - RATE_LIMIT_WINDOW=60
    depends_on:
      - mcp-server
      - agent-system-b
      - mongodb
      - redis
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────
  # Agent System B (Pricing ReAct Agent)
  # ─────────────────────────────────────────────────────────────────────
  agent-system-b:
    build:
      context: ./services/agent-system-b
      dockerfile: Dockerfile
    container_name: agent-system-b
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AGENT_B_MODEL=${AGENT_B_MODEL:-gpt-4o-mini}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
    networks:
      - backend-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────
  # MCP Server (RAG Tools + Error Codes + Ingestion)
  # ─────────────────────────────────────────────────────────────────────
  mcp-server:
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    container_name: mcp-server
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-eu-north-1}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-final-project-inmind}
      - QDRANT_URL=http://vector-db:6333
      - REDIS_URL=redis://redis-cache:6379
    depends_on:
      - vector-db
      - redis
    networks:
      - backend-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────
  # Infrastructure: Qdrant (Vector DB)
  # ─────────────────────────────────────────────────────────────────────
  vector-db:
    image: qdrant/qdrant:latest
    container_name: vector-db
    ports:
      - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - backend-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────
  # Infrastructure: Redis (Caching + Rate Limiting)
  # ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis/redis-stack:latest
    container_name: redis-cache
    ports:
      - "6380:6379"
      - "8083:8001"
    volumes:
      - redis-storage:/data
    networks:
      - backend-net
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────
  # Infrastructure: MongoDB (Conversations + Users + Feedback)
  # ─────────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-storage:/data/db
    networks:
      - backend-net
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────
volumes:
  qdrant-storage:
    driver: local
  redis-storage:
    driver: local
  mongo-storage:
    driver: local
